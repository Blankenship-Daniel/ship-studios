name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python ">=3.12,<3.14" (3.14 deliberately excluded —
        # the sibling DSP wheels are only validated through 3.13).
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # The drum-prep extra pulls numpy/scipy/soundfile/pyloudnorm, which mypy
      # needs importable (it type-checks both ship_studios and drum_prep).
      - name: Sync (dev + drum-prep extra)
        run: uv sync --extra drum-prep

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type-check (mypy)
        run: uv run mypy

      # Deterministic skill-contract lint (stdlib only): the recurring [G]-keyless
      # label bug, wikilink resolution, and frontmatter presence across .claude/skills.
      # The deeper agent-based audit-skill-consistency workflow can't run in CI.
      - name: Lint skills (doc contract)
        run: uv run python scripts/lint_skills.py

      - name: Test (pytest)
        run: uv run pytest -q

  # The `test` leg above syncs --extra drum-prep, so the DSP deps are always
  # present and the documented "Hub tests run on base deps alone / offline full
  # suite" contract is never gated — the drum-prep leg masks a base-deps break.
  # This cheap leg pins it: bare `uv sync` (no extras, no DSP wheels to build),
  # then the full suite, which must pass with the drum_prep + scripts/mix +
  # vst-harness DSP tests SKIPPING cleanly. Single Python (3.12) is enough.
  base-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Sync (base deps only — no extras)
        run: uv sync

      - name: Test (pytest)
        run: uv run pytest -q
