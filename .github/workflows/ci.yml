name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Additive triggers for the opt-in live-contract job below — never fire on PRs,
  # so they can't block the normal gate.
  workflow_dispatch:
  schedule:
    # Nightly (03:17 UTC) so the live tool-name + enum contract is re-checked
    # against the real sibling servers off the PR critical path.
    - cron: "17 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python ">=3.12,<3.14" (3.14 deliberately excluded —
        # the sibling DSP wheels are only validated through 3.13).
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # The drum-prep extra pulls numpy/scipy/soundfile/pyloudnorm, which mypy
      # needs importable (it type-checks both ship_studios and drum_prep).
      - name: Sync (dev + drum-prep extra)
        run: uv sync --extra drum-prep

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type-check (mypy)
        run: uv run mypy

      # Deterministic skill-contract lint (stdlib only): the recurring [G]-keyless
      # label bug, wikilink resolution, and frontmatter presence across .claude/skills.
      # The deeper agent-based audit-skill-consistency workflow can't run in CI.
      - name: Lint skills (doc contract)
        run: uv run python scripts/lint_skills.py

      - name: Test (pytest)
        run: uv run pytest -q

  # The `test` leg above syncs --extra drum-prep, so the DSP deps are always
  # present and the documented "Hub tests run on base deps alone / offline full
  # suite" contract is never gated — the drum-prep leg masks a base-deps break.
  # This cheap leg pins it: bare `uv sync` (no extras, no DSP wheels to build),
  # then the full suite, which must pass with the drum_prep + scripts/mix +
  # vst-harness DSP tests SKIPPING cleanly. Single Python (3.12) is enough.
  base-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Sync (base deps only — no extras)
        run: uv sync

      - name: Test (pytest)
        run: uv run pytest -q

  # The DSP benchmarks live outside `testpaths`, so nothing ever executed them —
  # they could bit-rot (a renamed dsp helper, a changed signature) unnoticed until
  # someone next ran them by hand. This leg RUNS them so they stay green. It does
  # NOT enforce --benchmark-compare-fail: a 5% wall-clock threshold on a shared
  # runner is noise, and would fail at random. Compare against a saved baseline
  # locally when you need the real number (see benchmarks/test_dsp_bench.py).
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Sync (bench + drum-prep extras)
        run: uv sync --extra bench --extra drum-prep

      - name: Run DSP benchmarks (execution only, no regression gate)
        run: uv run pytest benchmarks/ -q --benchmark-disable

  # Separate, additive job: the live tool-name + enum-subset contract test
  # (test_pipelines.py::test_live_tool_names_exist_on_servers) opens the REAL
  # sibling MCP servers and asserts every tool/enum a pipeline emits exists on
  # them — the one guard against a sibling rename/removed enum slipping past the
  # offline suite (which only proves the hub is internally consistent).
  #
  # NOT in the PR/push gate: it only runs on manual dispatch or the nightly
  # schedule, and it never blocks `test`. It best-effort checks out the two
  # siblings next to this repo and points the hub at them; if they are absent or
  # unsyncable the test SKIPS cleanly (it self-skips unless both siblings expose
  # a pyproject.toml and the mcp SDK is importable), so this job stays green.
  live-contract:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub
        uses: actions/checkout@v6
        with:
          path: ship-studios

      # Best-effort sibling checkouts next to the hub. If a repo is private or
      # renamed the step is allowed to fail without failing the job; the test
      # then skips cleanly because the sibling pyproject.toml is absent.
      - name: Checkout stemmy-loops sibling (best-effort)
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/stemmy-loops-mcp
          path: stemmy-loops-mcp

      - name: Checkout stemmy-gemini sibling (best-effort)
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/stemmy-gemini-mcp
          path: stemmy-gemini-mcp

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Sync hub (mcp client needed to open the live servers)
        working-directory: ship-studios
        run: uv sync --extra drum-prep

      # Run only the live-marked contract test. SHIP_STUDIOS_LIVE_CONTRACT=1 arms
      # it; SHIP_STUDIOS_*_DIR point the hub at the siblings checked out above.
      # The test self-skips (does not fail) when a sibling is missing/unsynced.
      - name: Live tool-name + enum contract (skips cleanly if siblings absent)
        working-directory: ship-studios
        env:
          SHIP_STUDIOS_LIVE_CONTRACT: "1"
          SHIP_STUDIOS_LOOPS_DIR: ${{ github.workspace }}/stemmy-loops-mcp
          SHIP_STUDIOS_GEMINI_DIR: ${{ github.workspace }}/stemmy-gemini-mcp
        run: uv run pytest tests/test_pipelines.py -k live -q
