[project]
name = "ship-studios"
version = "0.1.0"
description = "Headless orchestration hub that drives the stemmy-loops + stemmy-gemini MCP servers through fixed mix/master/loop pipelines."
# Upper bound is conservative: the sibling MCP servers + drum_prep's DSP wheels
# (numpy/scipy/soundfile) are only validated through 3.13. Bump the cap once 3.14
# is exercised in CI against those deps.
requires-python = ">=3.12,<3.14"
dependencies = [
    # Official MCP SDK — the hub is a *client* of the two sibling servers, so it
    # only needs the client half (stdio_client + ClientSession), both in base
    # `mcp`; it never runs `mcp` as a CLI, so the [cli] extra (typer/rich) would
    # be dead weight. The >=1.23 floor matches the sibling servers' own SDK floor
    # so all three repos negotiate the same protocol version.
    "mcp>=1.23",
    # The headless CLI surface. click keeps the subcommand wiring declarative
    # and gives `ship-studios doctor` a clean --help even before the servers
    # are reachable.
    "click>=8.1",
]

[project.scripts]
ship-studios = "ship_studios.cli:main"
# Local drum-stem DSP package (opt-in via the `drum-prep` extra below). Kept a
# separate entry point from the hub so the MCP hub itself stays DSP-free.
drum-prep = "drum_prep.cli:main"

[project.optional-dependencies]
# Multi-mic drum stem prep (phase-align / reference-match / audition) — pure
# local DSP, NOT needed for the MCP hub. Install with: uv sync --extra drum-prep
drum-prep = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
]
# Opt-in performance measurement (docs/perf/). None of these are imported by the
# hub's default path — the perf trace (ship_studios.perf) is stdlib-only and runs
# only when SHIP_STUDIOS_PERF_LOG is set; these extras just add the measurement
# tooling on demand, keeping the base install dependency-light.
#   metrics  — per-subprocess CPU/RSS sampling for the JSONL perf trace.
metrics = [
    "psutil>=5.9",
]
#   bench    — render-time regression benchmarks under benchmarks/ (outside the
#              offline testpaths). Run: uv run --extra bench --extra drum-prep pytest benchmarks/
bench = [
    "pytest-benchmark>=4",
]
#   profiling — on-demand deep profilers (CLI tools, not imported by the package):
#              Scalene (Python-vs-native CPU+memory), py-spy (attach to a live
#              process), memray (native-allocation memory). See docs/perf/roadmap.md.
profiling = [
    "scalene>=1.5",
    "py-spy>=0.3",
    "memray>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ship_studios", "drum_prep"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-xdist>=3",  # OPT-IN: parallel local runs via `uv run pytest -n auto`; do NOT wire into addopts (default serial run is the contract; xdist is for the full-suite loop, useless for `-k one_test`)
]

[tool.ruff]
# The codebase reads at ~100 cols (dense DSP + tool-arg dicts); match it rather
# than reflow everything to 88.
line-length = 100
# Lint the library + tests, not the one-off experiment/probe helpers under
# scripts/ and presets/, nor the per-track human-owned scratch under projects/
# (deliberately terse; mypy likewise only covers the two packages via
# [tool.mypy] files). Keeps `ruff check` / CI focused on shipped code.
extend-exclude = ["scripts", "presets", "projects"]

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus bugbear (B — real bug classes like B904/B905),
# isort (I — import order), and pyupgrade (UP — modern syntax). These catch
# exactly the lint classes the bare default ruleset let through.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.pytest.ini_options]
# Pipeline tests are async; let pytest-asyncio drive bare `async def test_*`
# without a per-test decorator so the suite reads like the production code.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["ship_studios", "drum_prep"]
warn_unused_ignores = true
warn_redundant_casts = true

# The MCP SDK ships partial stubs; the client surface we touch
# (stdio_client / ClientSession / StdioServerParameters) is well understood,
# so an untyped import here doesn't meaningfully weaken our own type check.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true

# DSP libraries used only by the optional drum_prep package ship no/partial stubs.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*", "soundfile", "pyloudnorm"]
ignore_missing_imports = true

# psutil is an opt-in (`metrics` extra) dependency the perf module imports lazily;
# ship no stubs and may be absent in the base dev env, so don't fail the type check.
[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true
